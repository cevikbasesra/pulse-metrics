services:
  postgres:
    image: postgres:16
    container_name: pulse-metrics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsemetrics
      POSTGRES_PASSWORD: pulsemetrics_dev
      POSTGRES_DB: pulsemetrics
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
